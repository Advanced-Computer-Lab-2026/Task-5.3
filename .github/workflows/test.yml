name: tests
on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run install:all
      - run: npm test
        env:
          JWT_SECRET: test-secret
          JWT_EXPIRES_IN: 7d